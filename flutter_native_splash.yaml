flutter_native_splash:

  # Fondo — verde institucional SENA, para que el logo (que ya trae su
  # propio fondo verde) se funda con la pantalla completa.
  color: "#39A900"

  # Logo principal
  image: assets/images/logo.png

  # Pantalla completa
  fullscreen: true

  android: true
  ios: true
  web: false

  # =========================
  # Android 12+
  # =========================
  android_12:
    color: "#39A900"
    image: assets/images/logo.png
    icon_background_color: "#39A900"
